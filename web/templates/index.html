<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>

  <!-- Fondo animado -->
  <div class="bg-noise"></div>
  <div class="bg-vignette"></div>

  <!-- Layout principal -->
  <div class="layout">

    <!-- Panel lateral izquierdo (en el móvil, cajón que abre el botón ☰) -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar panel">✕</button>
      <div class="sidebar-header">
        <span class="sidebar-title">Memoria</span>
        <div class="memory-dot" id="memoryDot"></div>
      </div>

      <div class="memory-section">
        <div class="memory-label">Identidad</div>
        <div class="memory-item" id="memNombre">—</div>
        <div class="memory-item" id="memRol">—</div>
      </div>

      <div class="memory-section">
        <div class="memory-label">Intereses</div>
        <div id="memIntereses" class="memory-tags"></div>
      </div>

      <div class="memory-section">
        <div class="memory-label">Notas</div>
        <div id="memNotas" class="memory-notes"></div>
      </div>

      <div class="memory-section">
        <div class="memory-label">Sesión</div>
        <div class="memory-stat">
          <span class="stat-label">Mensajes</span>
          <span class="stat-value" id="memMensajes">0</span>
        </div>
      </div>

      <!-- Proyectos -->
      <div class="sidebar-header" style="margin-top: 2rem;">
        <span class="sidebar-title">Proyectos</span>
      </div>
      <div id="proyectosList" class="proyectos-list"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Zona principal -->
    <main class="main">

      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <button class="menu-btn" id="menuBtn" aria-label="Memoria y proyectos" aria-controls="sidebar" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="logo-mark">✦</div>
          <div class="header-text">
            <h1 class="title">CAIN</h1>
            <span class="subtitle">Maestro de Ceremonias</span>
          </div>
        </div>
        <div class="status-area">
          <div class="status-indicator" id="statusDot"></div>
          <span class="status-text" id="statusText">En línea</span>
        </div>
      </header>

      <!-- La Cara -->
      <div class="face-stage">
        <div class="face-orb" id="faceOrb">
          <canvas id="faceCanvas"></canvas>
        </div>
      </div>

      <!-- Chat -->
      <div class="chat-container" id="chatContainer">
        <!-- Mensaje de bienvenida -->
        <div class="message cain-message welcome-message">
          <div class="message-avatar">✦</div>
          <div class="message-content">
            <p>El escenario está listo. ¿En qué actuamos hoy?</p>
          </div>
        </div>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Escribe tu mensaje..."
            rows="1"
          ></textarea>
          <button class="mic-btn vad-btn" id="vadBtn" title="Manos libres: clic para activar y hablar sin presionar nada">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="4" y1="10" x2="4" y2="14"></line>
              <line x1="8" y1="7" x2="8" y2="17"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
              <line x1="16" y1="7" x2="16" y2="17"></line>
              <line x1="20" y1="10" x2="20" y2="14"></line>
            </svg>
          </button>
          <button class="mic-btn" id="micBtn" title="Mantén presionado para hablar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="input-hint">Enter para enviar · Shift+Enter para nueva línea · Mantén presionado el micrófono para hablar · Ondas para manos libres</div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="/static/js/state.js?v={{ v }}"></script>
  <script src="/static/js/chat.js?v={{ v }}"></script>
  <script src="/static/js/modal.js?v={{ v }}"></script>
  <script src="/static/js/memoria.js?v={{ v }}"></script>
  <script src="/static/js/proyectos.js?v={{ v }}"></script>
  <script src="/static/js/face.js?v={{ v }}"></script>
  <script src="/static/js/voice.js?v={{ v }}"></script>
  <script src="/static/js/websocket.js?v={{ v }}"></script>
  <script src="/static/js/main.js?v={{ v }}"></script>
</body>
</html>
